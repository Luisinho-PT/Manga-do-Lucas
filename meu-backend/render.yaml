services:
  - type: web
    name: manga-do-luquinhas-api
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: ADMIN_DISCORD_IDS
        sync: false
      - key: PRIVATE_ACCESS_EMAILS
        sync: false
      - key: REPO_OWNER
        value: Luisinho-PT
      - key: REPO_NAME
        value: Manga-do-Lucas
      - key: GITHUB_TOKEN
        sync: false
